<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <title>home</title>
  </head>
  <body>
    <header>
      <div
        class="bg-[linear-gradient(90deg,#3A73AA_0%,#4F9D9E_100%)] flex items-center justify-between px-[20px]">
        <div class="cursor-pointe flex gap-[30px] item-center justify-center">
          <img src="image/badelha2.png" alt="" class="cursor-pointe w-[60px] h-[60px] my-[20px]" />
          <div class="bg-[#918e8e] w-[2px] h-[80px] my-[10px]"></div>
        </div>

        <div class="flex">
          <ul class="flex gap-[40px]">
            <li>
              <a
                href="#"
                class="text-[#fff] font-bold hover:text-[#C4C4C4] transition-all duration-300"
                >الرئيسية</a
              >
            </li>
            <li>
              <a
                href="#"
                class="text-[#C4C4C4] font-bold hover:text-[#fff] transition-all duration-300"
                >من نحن</a
              >
            </li>
            <li>
              <a
                href="#"
                class="text-[#C4C4C4] font-bold hover:text-[#fff] transition-all duration-300"
                >السوق</a
              >
            </li>
            <li>
              <a
                href="#"
                class="text-[#C4C4C4] font-bold hover:text-[#fff] transition-all duration-300"
                >إتصل بنا</a
              >
            </li>
          </ul>
        </div>
        <div class="flex gap-[10px] items-center">
          <div class="relative w-[150px]">
            <i
              class="fa-solid fa-location-dot absolute right-3 top-1/2 -translate-y-1/2 text-[#fff] mr-[-10px] pt-[10px]"></i>
            <select
              class="rounded-[10px] w-[150px] h-[50px] px-4 py-3 rounded-lg hover:scale-[1.03] transition-all duration-300 border border-gray-300 outline-none text-[#fff]">
              <option value="" class="text-[#000]">اختر المنطقة</option>
              <option value="gaza" class="text-[#000]">غزة</option>
              <option value="gaza" class="text-[#000]">شمال غزة</option>
              <option value="deir-al-balah" class="text-[#000]">دير البلح</option>
              <option value="khan-younis" class="text-[#000]">خان يونس</option>
              <option value="rafah" class="text-[#000]">رفح</option>
            </select>
          </div>
          <div
            class="flex items-center justify-between hover:scale-[1.03] transition-all duration-300 border border-[#ccc] rounded-[10px] w-[150px] h-[50px]">
            <p class="px-[5px] text-[#fff] cursor-pointer">إضافة</p>
            <i class="fa-solid fa-plus px-[5px] text-[#fff] cursor-pointer"></i>
          </div>
          <div
            class="bg-[#fff] w-[150px] h-[50px] rounded-[10px] hover:bg-[linear-gradient(90deg,#3A73AA_0%,#4F9D9E_100%)] transition-all duration-300 hover:text-[#fff] outline-none flex items-center justify-center">
            <a href="index.html" class="text-center">تسجيل دخول</a>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="">
        <div class="w-full h-[400px] flex justify-center items-center relative">
          <!-- الفيديو / الأنيميشن بالخلف -->
          <iframe
            src="./image/barter-animation-realistic.html"
            class="w-full h-[500px] border-0 absolute inset-0"
            title="Animation">
          </iframe>

          <!-- الكلام فوق الفيديو -->
          <div class="relative px-4">
            <h2 class="text-[15px] font-bold mb-1 text-[#c1c6c9c4] mt-[50px]">
              منصة مجتمعية في غزة
            </h2>

            <p class="text-[#fff] text-[50px] font-bold text-center mt-[20px]">
              بدّلها.. بادل، بيع، أو اشترِ.. <br />كل احتياجاتك بمنصة واحدة.
            </p>
            <p class="text-[#013B59] text-center mt-[10px]">
              وفر الكاش وبادل بالموجود بين إيديك. تخلص من فائض ما لديك واحصل على <br />
              ما تحتاج بكل سهولة وأمان في غزة.
            </p>
            <input
              type="text"
              placeholder="ابحث عن طعام، طاقة، مستلزمات..."
              class="bg-[#F1F4F9] mt-[30px] p-[10px] px-[50px] w-full focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.30)] outline-0 rounded-[15px]" />
            <i
              class="fa-solid fa-magnifying-glass absolute bottom-[125px] left-[30px] cursor-pointer text-[#ccc]"></i>

            <div class="flex items-center justify-center gap-[15px] mt-[30px]">
              <div
                class="bg-[linear-gradient(90deg,#3A73AA_0%,#4F9D9E_100%)] py-[15px] px-[40px] mt-[30px] rounded-[15px] cursor-pointer hover:scale-[1.08] transition-all duration-300">
                <p class="text-[#fff]">اعرض سلعتك</p>
              </div>
              <div
                class="bg-[#fff] py-[15px] px-[40px] mt-[30px] rounded-[15px] cursor-pointer hover:scale-[1.08] transition-all duration-300">
                <p class="text-[#4181A6]">تصفح العروض</p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
