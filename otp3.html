<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="css/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body class="bg-[#FCFEFF]">
    <header>
      <div>
        <img src="image/badelha.png" alt="" />
      </div>
    </header>

    <main>
      <div class="min-h-screen flex justify-center items-center px-4">
        <div class="w-full max-w-[400px] border border-[#ccc] rounded-[15px] p-[10px] sm:p-[15px]">
          <!-- Title -->
          <div class="block my-[5px]">
            <h2 class="text-center m-[3px] font-bold text-[#013b59] text-[20px] sm:text-[25px]">
              تعيين كلمة المرور الجديدة
            </h2>

            <p class="text-center mt-[5px] text-[#817f7f] text-[13px] sm:text-[15px]">
              قم بتعيين كلمة المرور الجديدة لحسابك حتى تتمكن من <br />تسجيل الدخول
            </p>
          </div>
          <form action="" class="px-[5px] sm:px-[10px] mt-[20px]">
            <!-- Password -->
            <div class="relative">
              <div class="flex justify-between items-center">
                <label for="password" class="block text-[14px] sm:text-[15px]"
                  >كلمة المرور الجديدة</label
                >

                <a href="#" class="text-[13px] text-[#929191]"></a>
              </div>

              <input
                id="password"
                type="password"
                placeholder="••••••••"
                class="w-full p-[8px] my-[10px] bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />

              <i
                class="fa-solid fa-eye absolute left-[10px] bottom-[23px] text-[#b7b4b4] cursor-pointer"></i>

              <i
                class="fa-solid fa-eye-slash absolute left-[10px] bottom-[23px] text-[#b7b4b4] !hidden cursor-pointer"></i>
            </div>
            <div class="relative">
              <div class="flex justify-between items-center">
                <label for="password" class="block text-[14px] sm:text-[15px]"
                  >تأكيد كلمة المرور الجديدة</label
                >

                <a href="#" class="text-[13px] text-[#929191]"></a>
              </div>

              <input
                id="password"
                type="password"
                placeholder="••••••••"
                class="w-full p-[8px] my-[10px] bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />

              <i
                class="fa-solid fa-eye absolute left-[10px] bottom-[23px] text-[#b7b4b4] cursor-pointer"></i>

              <i
                class="fa-solid fa-eye-slash absolute left-[10px] bottom-[23px] text-[#b7b4b4] !hidden cursor-pointer"></i>
            </div>
          </form>
          <!-- Login Button -->
          <button
            class="block mx-auto cursor-pointer transition-[all] duration-800 hover:from-[#4f8ac1] hover:to-[#6ccacc] bg-gradient-to-r from-[#3A73AA] to-[#4F9D9E] w-full p-[10px] rounded-[10px] mt-[10px] mb-[10px] text-[#fff]">
            التالي
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
