<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="css/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body class="bg-[#FCFEFF]">
    <header>
      <div>
        <img src="image/badelha.png" alt="" class="w-[200px] h-[100px]" />
      </div>
    </header>

    <main>
      <div class="min-h-screen flex justify-center items-center px-4">
        <div class="w-full max-w-[400px] border border-[#ccc] rounded-[15px] p-[10px] sm:p-[15px]">
          <!-- Title -->
          <div class="block my-[5px]">
            <h2 class="text-center m-[3px] font-bold text-[#013b59] text-[20px] sm:text-[25px]">
              رمز التحقق
            </h2>

            <p class="text-center mt-[5px] text-[#817f7f] text-[13px] sm:text-[15px]">
              أدخل رمز التحقق المرسل إلى إيميلك
            </p>
          </div>

          <!-- Verification Code -->
          <div class="mt-[20px]">
            <label for="otp" class="block text-[14px] sm:text-[15px] mb-[10px]"> رمز التحقق </label>

            <div
              class="flex justify-center items-center gap-[12px] sm:gap-[12px] direction-ltr"
              dir="ltr">
              <input
                type="text"
                maxlength="1"
                inputmode="numeric"
                placeholder="_"
                class="otp-input focus:border-none w-[55px] h-[60px] text-center text-[20px] font-bold bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />

              <input
                type="text"
                maxlength="1"
                inputmode="numeric"
                placeholder="_"
                class="otp-input focus:border-none w-[55px] h-[60px] text-center text-[20px] font-bold bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />

              <input
                type="text"
                maxlength="1"
                inputmode="numeric"
                placeholder="_"
                class="otp-input focus:border-none w-[55px] h-[60px] text-center text-[20px] font-bold bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />

              <input
                type="text"
                maxlength="1"
                inputmode="numeric"
                placeholder="_"
                class="otp-input focus:border-none w-[55px] h-[60px] text-center text-[20px] font-bold bg-[#f1f4f9] border border-[#D8D8D8] rounded-[10px] outline-none focus:border-[#013b59] focus:shadow-[0_0_8px_rgba(0,0,0,0.15)]" />
            </div>
          </div>
          <!-- Login Button -->
          <button
            class="block mx-auto cursor-pointer transition-[all] duration-800 hover:from-[#4f8ac1] hover:to-[#6ccacc] bg-gradient-to-r from-[#3A73AA] to-[#4F9D9E] w-full p-[10px] rounded-[10px] mt-[10px] mb-[10px] text-[#fff]">
            المتابعة
          </button>
          <div class="flex text-center items-center justify-center mt-[20px] mb-[18px] gap-[5px]">
            <p class="text-[#828181]">إعادة إرسال رمز التحقق</p>

            <a href="index.html" class="line-clamp-1 text-[#041167] underline text-[700]">
              00:59
            </a>
          </div>
        </div>
      </div>
    </main>
    <script src="js/otp.js"></script>
    <!-- Code injected by live-server -->
    <script>
      // <![CDATA[  <-- For SVG support
      if ('WebSocket' in window) {
        (function () {
          function refreshCSS() {
            var sheets = [].slice.call(document.getElementsByTagName('link'));

            for (var i = 0; i < sheets.length; ++i) {
              var elem = sheets[i];

        })();
      } else {

    </script>
  </body>
</html>
